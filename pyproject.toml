[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "home-credit-risk"
version = "0.1.0"
description = "Reproducible relational features and LightGBM for Home Credit Default Risk"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "lightgbm>=4.6,<5", "scikit-learn>=1.6,<2", "pyarrow>=18,<25"]

[project.scripts]
home-credit = "home_credit.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
lab = ["jupyterlab>=4,<5", "nbclient>=0.10,<1", "nbconvert>=7,<8", "matplotlib>=3.10,<4"]
data = ["kaggle>=2,<3"]
tracking = ["mlflow-skinny>=3,<4"]
tracking-test = ["sqlalchemy>=2,<3", "alembic>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/home_credit"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
